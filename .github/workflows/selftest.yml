# CI for the guardrails repo itself: prove every rule still fires on the fixture.
name: selftest

# `push` bare på main: med både `push` og `pull_request` uten filter kjører alt to
# ganger for hver push til en gren med åpen PR (samme klasse som i README-snutten).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    # Målt 2026-10-18: 11–14 s.
    timeout-minutes: 10
    steps:
      # Selftesten kjører bare test/run.mjs — den pusher ingenting, så tokenet skal
      # ikke bli liggende i .git/config (checkout v2+ skriver den dit som default).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node test/run.mjs
