# Copy this into a consuming repo at .github/workflows/guardrails.yml
# (rename the file; keep the job). One line wires the whole security floor in.
name: guardrails

# NOT `on: [push, pull_request]` and not a bare `push:`: that runs everything twice
# for every push to a branch with an open PR (the push event AND `synchronize`).
# Measured 2026-08-27: the account ran out of Actions minutes and all CI stopped.
# Check your default branch (tripcraft uses `master`).
on:
  push:
    branches: [main]
  pull_request:

# Write `permissions` here. Without it the job gets the repo's default for
# GITHUB_TOKEN, which can change in the settings without showing up in any diff.
# This job may receive SUPABASE_ACCESS_TOKEN, and it only needs to READ the repo.
# The reusable workflow inherits this.
permissions:
  contents: read

jobs:
  guardrails:
    # Pin BOTH references to a commit SHA, not `@v1`. `v1` is a movable tag in a
    # public repo, and this job may hold SUPABASE_ACCESS_TOKEN: moving the tag would
    # run other code with the token, with no change in this file. `ref:` must be
    # pinned too, because the reusable workflow fetches its own script again at that
    # ref (default `v1`).
    uses: rogeragerup-code/agertechai-guardrails/.github/workflows/check.yml@6fabe76f40ef0f7aade402e7a33dba6d51dc6748 # v1
    with:
      ref: 6fabe76f40ef0f7aade402e7a33dba6d51dc6748 # v1, same SHA as `uses:`
      # Optional: also run the Supabase Security Advisor on every push. Add the
      # SUPABASE_ACCESS_TOKEN repo secret and your project ref to enable it.
      # Omit both to run code checks only (the DB step skips cleanly).
      # supabase_project_ref: your-project-ref
    # secrets:
    #   SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
